<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favorites - CineVerse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
    background: #0b0f19;
    color: #e2e8f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
}
.navbar {
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 14px 24px;
}
.movie-card {
    background: #1e293b;
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.3s;
    height: 100%;
    display: flex;
    flex-direction: column;
}
.movie-card:hover {
    transform: translateY(-6px);
}
.movie-card img {
    width: 100%;
    height: 310px;
    object-fit: cover;
}
</style>
    <!-- Mobile App PWA Meta & Styles -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CineVerse">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand text-warning fw-bold fs-4" href="dashboard.html">
             CineVerse Favorites
        </a>
        <a href="dashboard.html" class="btn btn-warning btn-sm fw-bold"> Dashboard</a>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-danger fw-bold m-0"><i class="bi bi-heart-fill me-2"></i> My Favorite Movies</h2>
        <span id="favCount" class="badge bg-secondary fs-6">0 Movies</span>
    </div>

    <div class="row g-4" id="favoriteContainer">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-warning"></div>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/favorites.js"></script>


<!-- Mobile Bottom App Navigation Bar -->
<div class="mobile-bottom-nav">
    <a href="dashboard.html" class="mobile-nav-item">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
    </a>
    <a href="recommendation.html" class="mobile-nav-item">
        <i class="bi bi-stars"></i>
        <span>AI Picks</span>
    </a>
    <a href="favorites.html" class="mobile-nav-item">
        <i class="bi bi-heart-fill"></i>
        <span>Favorites</span>
    </a>
    <a href="feedback.html" class="mobile-nav-item">
        <i class="bi bi-chat-dots-fill"></i>
        <span>Feedback</span>
    </a>
    <a href="profile.html" class="mobile-nav-item">
        <i class="bi bi-person-fill"></i>
        <span>Profile</span>
    </a>
</div>

<!-- Floating Install Mobile App Banner -->
<div id="installBanner" class="install-app-banner">
    <div class="d-flex align-items-center gap-2">
        <img src="icons/icon-192.png" width="36" height="36" class="rounded-3" alt="App Icon">
        <div>
            <div class="fw-bold text-white small">Install CineVerse App</div>
            <div class="text-muted" style="font-size:10px;">Fast Fullscreen Mobile Experience</div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-warning btn-sm fw-bold" id="installAppBtn">Install</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('installBanner').style.display='none'">✕</button>
    </div>
</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(e => console.warn(e));
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const banner = document.getElementById('installBanner');
    if (banner) banner.style.display = 'flex';
});
const installBtn = document.getElementById('installAppBtn');
if (installBtn) {
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            document.getElementById('installBanner').style.display = 'none';
        }
    });
}
// Highlight active tab in mobile bottom nav
document.querySelectorAll('.mobile-bottom-nav a').forEach(a => {
    const href = a.getAttribute('href');
    if (href && (window.location.pathname.endsWith(href) || (href === 'dashboard.html' && window.location.pathname === '/'))) {
        document.querySelectorAll('.mobile-bottom-nav a').forEach(el => el.classList.remove('active'));
        a.classList.add('active');
    }
});
</script>
</body>
</html>
