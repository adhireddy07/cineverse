<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Feedback & Reviews - CineVerse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
    background: #0b0f19;
    color: #e2e8f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
}
.navbar {
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 14px 24px;
}
.feedback-card {
    background: rgba(22, 27, 34, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}
.form-control, .form-select {
    background: #1e293b;
    border: 1px solid #334155;
    color: #fff;
    border-radius: 10px;
    padding: 12px;
}
.form-control:focus, .form-select:focus {
    background: #1e293b;
    border-color: #ffc107;
    color: #fff;
    box-shadow: 0 0 12px rgba(255,193,7,0.4);
}
.review-item {
    background: #1e293b;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    margin-bottom: 12px;
}
</style>
    <!-- Mobile App PWA Meta & Styles -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CineVerse">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand text-warning fw-bold fs-4" href="dashboard.html">
             CineVerse Community Reviews
        </a>
        <a href="dashboard.html" class="btn btn-warning btn-sm fw-bold"> Dashboard</a>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-5">
        <!-- Submit Feedback Column -->
        <div class="col-lg-5">
            <div class="feedback-card">
                <h3 class="text-warning fw-bold mb-3"><i class="bi bi-chat-heart-fill me-2"></i> Movie Feedback</h3>
                <p class="text-muted small mb-4">Share your honest thoughts and ratings to help improve recommendations.</p>

                <form id="feedbackForm">
                    <div class="mb-3">
                        <label class="form-label text-warning small fw-bold">YOUR NAME</label>
                        <input type="text" id="fbName" class="form-control" placeholder="Your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-warning small fw-bold">MOVIE NAME</label>
                        <input type="text" id="fbMovie" class="form-control" placeholder="e.g. Interstellar, RRR" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-warning small fw-bold">RATING</label>
                        <select id="fbRating" class="form-select">
                            <option value="5"> Excellent (5/5)</option>
                            <option value="4"> Very Good (4/5)</option>
                            <option value="3"> Good (3/5)</option>
                            <option value="2"> Average (2/5)</option>
                            <option value="1"> Poor (1/5)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-warning small fw-bold">YOUR REVIEW</label>
                        <textarea id="fbReview" rows="4" class="form-control" placeholder="Write your review here..."></textarea>
                    </div>

                    <button type="submit" id="fbSubmitBtn" class="btn btn-warning w-100 fw-bold py-2">
                        Submit Feedback
                    </button>
                </form>
            </div>
        </div>

        <!-- Recent Reviews Column -->
        <div class="col-lg-7">
            <h3 class="text-white fw-bold mb-3"><i class="bi bi-chat-square-quote-fill text-warning me-2"></i> Recent Community Reviews</h3>
            <div id="reviewsList">
                <div class="text-center py-4"><div class="spinner-border text-warning"></div></div>
            </div>
        </div>
    </div>
</div>

<script src="js/feedback.js"></script>

<!-- Mobile Bottom App Navigation Bar -->
<div class="mobile-bottom-nav">
    <a href="dashboard.html" class="mobile-nav-item">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
    </a>
    <a href="recommendation.html" class="mobile-nav-item">
        <i class="bi bi-stars"></i>
        <span>AI Picks</span>
    </a>
    <a href="favorites.html" class="mobile-nav-item">
        <i class="bi bi-heart-fill"></i>
        <span>Favorites</span>
    </a>
    <a href="feedback.html" class="mobile-nav-item">
        <i class="bi bi-chat-dots-fill"></i>
        <span>Feedback</span>
    </a>
    <a href="profile.html" class="mobile-nav-item">
        <i class="bi bi-person-fill"></i>
        <span>Profile</span>
    </a>
</div>

<!-- Floating Install Mobile App Banner -->
<div id="installBanner" class="install-app-banner">
    <div class="d-flex align-items-center gap-2">
        <img src="icons/icon-192.png" width="36" height="36" class="rounded-3" alt="App Icon">
        <div>
            <div class="fw-bold text-white small">Install CineVerse App</div>
            <div class="text-muted" style="font-size:10px;">Fast Fullscreen Mobile Experience</div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-warning btn-sm fw-bold" id="installAppBtn">Install</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('installBanner').style.display='none'">✕</button>
    </div>
</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(e => console.warn(e));
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const banner = document.getElementById('installBanner');
    if (banner) banner.style.display = 'flex';
});
const installBtn = document.getElementById('installAppBtn');
if (installBtn) {
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            document.getElementById('installBanner').style.display = 'none';
        }
    });
}
// Highlight active tab in mobile bottom nav
document.querySelectorAll('.mobile-bottom-nav a').forEach(a => {
    const href = a.getAttribute('href');
    if (href && (window.location.pathname.endsWith(href) || (href === 'dashboard.html' && window.location.pathname === '/'))) {
        document.querySelectorAll('.mobile-bottom-nav a').forEach(el => el.classList.remove('active'));
        a.classList.add('active');
    }
});
</script>
</body>
</html>
