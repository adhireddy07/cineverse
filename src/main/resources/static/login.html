<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Face Verification - CineVerse</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffc107">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineVerse">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    background: linear-gradient(135deg, rgba(11, 15, 25, 0.85) 0%, rgba(11, 15, 25, 0.92) 100%),
                url('/images/movie-collage-bg.jpg') center/cover fixed no-repeat;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
}
.login-card {
    width: 100%;
    max-width: 460px;
    background: rgba(22, 27, 34, 0.90);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    overflow: hidden;
}
.card-header {
    background: linear-gradient(135deg, #ffc107, #ff5722);
    color: #0b0f19;
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    padding: 20px;
}
.form-control {
    background: #1e293b;
    color: #fff;
    border: 1px solid #334155;
    border-radius: 10px;
    height: 48px;
    padding: 10px 16px;
}
.form-control:focus {
    background: #1e293b;
    color: #fff;
    border-color: #ffc107;
    box-shadow: 0 0 12px rgba(255,193,7,.45);
}
.form-label {
    color: #ffd54f;
    font-size: 14px;
    font-weight: bold;
}
.btn-login {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    color: #0b0f19;
    background: linear-gradient(90deg, #ffb300, #ff5722);
    transition: transform 0.2s;
}
.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
    color: #000;
}
/* Biometric Modal */
.scanner-circle {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ffc107;
    box-shadow: 0 0 25px rgba(255, 193, 7, 0.4);
    background: #000;
}
#loginCamera {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.scanner-laser {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: #00e676;
    box-shadow: 0 0 12px #00e676;
    animation: scanPulse 2s infinite ease-in-out;
}
@keyframes scanPulse {
    0% { top: 0%; }
    50% { top: 96%; }
    100% { top: 0%; }
}
</style>
    <!-- Mobile App PWA Meta & Styles -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CineVerse">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>

<div class="login-card">
    <div class="card-header">
         CineVerse Login
    </div>
    <div class="p-4">
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">EMAIL ADDRESS</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-4">
                <label class="form-label">PASSWORD</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-login">
                Proceed to Verification
            </button>
        </form>

        <hr class="border-secondary my-4">
        <div class="text-center text-muted small">
            Don't have an account? <a href="register.html" class="text-warning fw-bold text-decoration-none">Register Here</a>
        </div>
    </div>
</div>

<!-- Step 2: Biometric Verification Modal (DOB + Face) -->
<div class="modal fade" id="biometricModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-warning">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-warning">
                    <i class="bi bi-shield-lock-fill me-2"></i> Multi-Factor Biometric Verification
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="closeLoginCamera()"></button>
            </div>
            <div class="modal-body text-center p-4">
                <p class="small text-muted mb-3">
                    For your security, verify your <strong>Date of Birth</strong> and scan your <strong>Face</strong>.
                </p>

                <!-- 1. DOB Input -->
                <div class="mb-3 text-start">
                    <label class="form-label text-warning small">VERIFY DATE OF BIRTH</label>
                    <input type="date" id="verifyDob" class="form-control" required>
                </div>

                <!-- 2. Face Scanner -->
                <label class="form-label text-warning small d-block text-start mb-2">LIVE FACE RECOGNITION</label>
                <div class="scanner-circle mb-3">
                    <video id="loginCamera" autoplay playsinline muted></video>
                    <div class="scanner-laser"></div>
                </div>

                <div id="bioStatusMsg" class="small text-warning mb-3">
                    Ready to scan face...
                </div>

                <div class="d-flex gap-2 justify-content-center">
                    <button type="button" id="verifyFaceBtn" class="btn btn-warning fw-bold" onclick="performBiometricVerification()">
                        <i class="bi bi-check-circle-fill me-1"></i> Verify Face & Login
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="simulateLoginVerification()">
                        Fallback Simulator
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/face-verify.js"></script>
<script src="js/login.js"></script>


<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(e => console.warn(e));
}
</script>
</body>
</html>
