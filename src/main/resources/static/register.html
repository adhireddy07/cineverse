<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register & Face Verification - CineVerse</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffc107">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineVerse">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
    background: #0b0f19;
    color: #e2e8f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
}
.auth-card {
    width: 100%;
    max-width: 520px;
    background: rgba(22, 27, 34, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    overflow: hidden;
}
.card-header {
    background: linear-gradient(135deg, #ffc107, #ff5722);
    color: #0b0f19;
    padding: 22px;
    text-align: center;
    font-weight: 800;
    font-size: 24px;
}
.form-control, .form-select {
    background: #1e293b;
    border: 1px solid #334155;
    color: #fff;
    border-radius: 10px;
    padding: 12px 16px;
}
.form-control:focus, .form-select:focus {
    background: #1e293b;
    border-color: #ffc107;
    color: #fff;
    box-shadow: 0 0 12px rgba(255, 193, 7, 0.4);
}
.age-badge-box {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
    margin-top: 8px;
}
.age-adult {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid #10b981;
    color: #34d399;
}
.age-minor {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
    color: #f87171;
}
.btn-primary-custom {
    background: linear-gradient(90deg, #ffc107, #ff5722);
    border: none;
    color: #111;
    font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
    font-size: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
}
.btn-primary-custom:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
    color: #000;
}
/* Camera Biometric Modal */
.scanner-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 0 auto;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ffc107;
    box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
    background: #000;
}
#cameraFeed {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.scanner-laser {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ffc107, #ff5722, transparent);
    box-shadow: 0 0 15px #ffc107;
    animation: scanAnim 2.5s infinite ease-in-out;
}
@keyframes scanAnim {
    0% { top: 0%; }
    50% { top: 96%; }
    100% { top: 0%; }
}
.snapshot-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid #ffc107;
    object-fit: cover;
    display: none;
    margin: 10px auto;
}
</style>
    <!-- Mobile App PWA Meta & Styles -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CineVerse">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>

<div class="auth-card">
    <div class="card-header">
         CineVerse Registration
    </div>
    <div class="p-4">
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label text-warning small fw-bold">FULL NAME</label>
                <input type="text" id="fullName" class="form-control" placeholder="e.g. John Doe" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-warning small fw-bold">EMAIL ADDRESS</label>
                <input type="email" id="email" class="form-control" placeholder="e.g. john@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-warning small fw-bold">PASSWORD</label>
                <input type="password" id="password" class="form-control" placeholder="Create a strong password" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-warning small fw-bold">DATE OF BIRTH (DOB)</label>
                <input type="date" id="dob" class="form-control" required>
                <div id="ageBadge" class="age-badge-box"></div>
            </div>

            <!-- Enrolled Biometrics Preview -->
            <div class="text-center mb-3">
                <img id="enrolledSnapshot" class="snapshot-preview" alt="Enrolled Face">
                <div id="biometricStatusText" class="text-muted small">Face Biometric enrollment required before submitting.</div>
            </div>

            <button type="button" id="openFaceModalBtn" class="btn btn-outline-warning w-100 mb-3 fw-bold">
                <i class="bi bi-camera-fill me-2"></i> Step 2: Live Face Verification & Enrollment
            </button>

            <button type="submit" id="submitBtn" class="btn btn-primary-custom" disabled>
                Complete Registration
            </button>
        </form>

        <hr class="border-secondary my-4">
        <div class="text-center text-muted small">
            Already have an account? <a href="login.html" class="text-warning fw-bold">Login Here</a>
        </div>
    </div>
</div>

<!-- Face Biometric Enrollment Modal -->
<div class="modal fade" id="faceModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-warning">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-warning"><i class="bi bi-shield-check me-2"></i> Face Biometric Enrollment</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="closeCamera()"></button>
            </div>
            <div class="modal-body text-center p-4">
                <p class="small text-muted mb-3">Position your face inside the circle. Keep good lighting and look straight into the camera.</p>
                
                <div class="scanner-container mb-3">
                    <video id="cameraFeed" autoplay playsinline muted></video>
                    <div class="scanner-laser"></div>
                </div>

                <div id="cameraStatus" class="small text-warning mb-3">Initializing camera...</div>

                <div class="d-flex gap-2 justify-content-center">
                    <button type="button" class="btn btn-warning fw-bold" onclick="captureAndEnrollFace()">
                        <i class="bi bi-camera"></i> Capture & Enroll Face
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="simulateFaceEnrollment()">
                        Fallback Simulator
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/face-verify.js"></script>
<script src="js/register.js"></script>


<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(e => console.warn(e));
}
</script>
</body>
</html>
