name: Build CineVerse Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build CineVerse APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Release Keystore
        working-directory: ./android/app
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias cineverse -dname "CN=CineVerse, OU=Mobile, O=CineVerse, L=Hyderabad, S=Telangana, C=IN" \
            -storepass cineverse123 -keypass cineverse123

      - name: Build Release APK
        working-directory: ./android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Download
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/CineVerse.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVerse-Android-APK
          path: build-output/CineVerse.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "CineVerse Android APK v1.0.0"
          body: |
            ### 🎬 CineVerse Android App v1.0.0
            
            Official Android APK for CineVerse Movie Streaming & AI Recommendations!
            
            - **Cloud Server:** `https://cineverse-mz61.onrender.com`
            - **Features:** AI Movie Feeds, Face Biometrics, Under-18 Content Protection, Embedded HD Trailers.
            
            #### 📱 How to Install:
            1. Download **`CineVerse.apk`** below.
            2. Tap the downloaded file on your phone.
            3. Tap **Install** (Enable "Install unknown apps" if prompted).
            4. Open CineVerse and enjoy movies on mobile!
          files: build-output/CineVerse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
